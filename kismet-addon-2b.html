<!-- ==================== KISMET ADDON 2B: CLICKABLE MAP TRACKER & NOTI ==================== -->
<script>
(function initKismetAddonPartB() {
    if (window.__kismetAddon2BLoaded) return;
    window.__kismetAddon2BLoaded = true;
    const getCap = (n) => (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins[n] : null;

    let curItemId = null, curGateId = null, curTrackText = '';
    const extractId = (t) => { const m = String(t || '').trim().match(/\b([A-Za-z]{1,4}\d{7,22}|\d{9,22})\b/); return m ? m[1].toUpperCase() : ''; };
    const detectCourier = (id) => {
        if (!id) return 'Tracking ID မထည့်ရသေးပါ';
        if (/^JT\d{9,}$/.test(id)) return 'J&T Express';
        if (/^SF\d{9,}$/.test(id)) return 'SF Express';
        if (/^YT\d{9,}$/.test(id)) return 'YTO Express';
        if (/^(75|78|73|54)\d{9,}$/.test(id)) return 'ZTO Express';
        return 'China Courier / Express';
    };

    function findItem(itemId, gateId) {
        if (gateId && typeof gateShipments !== 'undefined') {
            const g = gateShipments.find(s => s.id === gateId);
            if (g) { const it = (g.items || []).find(x => x && x.id === itemId); if (it) return { item: it, gate: g }; }
        }
        const list = (typeof allRouteRecords !== 'undefined' && typeof ROUTE_KEY !== 'undefined') ? (allRouteRecords[ROUTE_KEY] || []) : [];
        const d = list.find(x => x && x.id === itemId);
        if (d) return { item: d, gate: null };
        if (typeof gateShipments !== 'undefined') {
            for (const g of gateShipments) { const it = (g.items || []).find(x => x && x.id === itemId); if (it) return { item: it, gate: g }; }
        }
        return null;
    }

    function renderModal() {
        const found = findItem(curItemId, curGateId);
        const item = found ? found.item : { name: 'ပစ္စည်းစာရင်း', qty: 1, method: 'Air', note: '' };
        const gate = found ? found.gate : null;
        const m = item.method || 'Air';
        const emoji = m === 'Air' ? '✈️' : (m === 'Post' ? '📮' : '🚚');
        let pct = 25, sub = 'တရုတ် ➔ လားရှိုး လမ်းပေါ်', sum = 'လားရှိုးသို့ ပို့ဆောင်နေဆဲ';
        if (gate && gate.checked) { pct = 100; sub = 'ရန်ကုန် ရောက်ရှိပြီး'; sum = 'ပြီးစီးပြီ (' + (gate.checkedAt || gate.date) + ')'; }
        else if (gate) { pct = 82; sub = gate.gate + ' သို့ တင်ပို့ပြီး'; sum = 'ရန်ကုန်သို့ ပို့ဆောင်နေဆဲ'; }
        else if (item.arrived) { pct = 55; sub = 'လားရှိုးဂိတ် ရောက်ရှိပြီး'; sum = 'လားရှိုးရောက်ပြီး • ' + m; }

        document.getElementById('ktmHeroSub').innerText = sub;
        document.getElementById('ktmPctLabel').innerText = pct + '%';
        document.getElementById('ktmDestPill').innerText = gate ? gate.gate : 'ရန်ကုန်';
        document.getElementById('ktmStageSummary').innerText = sum;
        document.getElementById('ktmBarIcon').innerText = emoji;
        document.getElementById('ktmMapVehicleEmoji').textContent = emoji;

        const bf = document.getElementById('ktmBarFill'), bt = document.getElementById('ktmBarTruck');
        bf.style.width = '5%'; bt.style.left = '5%';
        requestAnimationFrame(() => requestAnimationFrame(() => { bf.style.width = pct + '%'; bt.style.left = pct + '%'; }));

        const ap = document.getElementById('ktmActivePath'), vg = document.getElementById('ktmMapVehicle');
        if (ap && vg && typeof ap.getTotalLength === 'function') {
            const len = ap.getTotalLength(), tgt = len * (pct / 100), pt = ap.getPointAtLength(tgt);
            ap.style.transition = 'none'; ap.style.strokeDasharray = len + ' ' + len; ap.style.strokeDashoffset = len;
            vg.setAttribute('transform', `translate(${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})`);
            void ap.getBoundingClientRect();
            requestAnimationFrame(() => { ap.style.transition = ''; ap.style.strokeDashoffset = String(Math.max(0, len - tgt)); });
        }

        const ex = extractId(item.note);
        curTrackText = ex || (item.note ? String(item.note).trim() : '');
        document.getElementById('ktmCourierName').innerText = detectCourier(ex);
        document.getElementById('ktmTrackIdDisplay').innerText = curTrackText || 'Tracking ID မရှိသေးပါ';
        document.getElementById('ktmTrackInput').value = item.note || '';
        document.getElementById('ktmItemName').innerText = `${item.name || 'ပစ္စည်း'} (Qty: ${item.qty || 1})`;
        document.getElementById('ktmItemMethodBadge').innerText = `${emoji} ${m}`;
        document.getElementById('ktmItemMeta').innerText = [item.source && `🛍️ ${item.source}`, item.buyer && `👤 ${item.buyer}`, item.kg && `⚖️ ${item.kg} Kg`].filter(Boolean).join(' • ') || 'တရုတ် - လားရှိုး - ရန်ကုန်';

        const steps = [
            { done: Boolean(gate && gate.checked), active: Boolean(gate && !gate.checked), t: 'ရန်ကုန် ရောက်ရှိမှု', d: gate ? `${gate.gate} (${gate.date})` : 'ကားဂိတ် မတင်ရသေးပါ' },
            { done: Boolean(item.arrived || gate), active: Boolean(item.arrived && !gate), t: 'လားရှိုးဂိတ်', d: (item.arrived || gate) ? `လားရှိုးရောက်ပြီး (${m})` : 'လားရှိုးသို့ သွားနေဆဲ' },
            { done: true, active: !item.arrived && !gate, t: 'တရုတ် မှာယူစာရင်း', d: `${item.source || 'China'} • ${curTrackText || 'No ID'}` }
        ];
        const esc = typeof escapeHTML === 'function' ? escapeHTML : (s => String(s || ''));
        document.getElementById('ktmTimelineList').innerHTML = steps.map((s, idx) => `
            <div class="relative pl-5 ${idx < steps.length - 1 ? 'pb-3 border-l border-neutral-800' : ''}">
                <span class="absolute -left-[6px] top-0.5 w-3 h-3 rounded-full ${s.done ? 'bg-orange-500 ring-4 ring-orange-500/20' : s.active ? 'bg-orange-400 animate-pulse' : 'bg-neutral-700'}"></span>
                <div class="text-xs font-extrabold ${s.done || s.active ? 'text-orange-400' : 'text-neutral-400'}">${esc(s.t)}</div>
                <div class="text-[11px] text-neutral-300 mt-0.5">${esc(s.d)}</div>
            </div>`).join('');
    }

    window.openKismetTrackModal = function(itemId, gateId) {
        curItemId = itemId || null; curGateId = gateId || null;
        renderModal();
        const modal = document.getElementById('kismetTrackModal');
        if (modal) modal.classList.remove('hidden');
    };
    window.closeKismetTrackModal = function() {
        const modal = document.getElementById('kismetTrackModal');
        if (modal) modal.classList.add('hidden');
    };
    window.copyActiveTrackId = function() {
        if (!curTrackText) { if (typeof showToast === 'function') showToast('Tracking ID မရှိသေးပါ'); return; }
        if (typeof copyTextToClipboard === 'function') copyTextToClipboard(curTrackText);
    };
    window.saveActiveTrackId = function() {
        const found = findItem(curItemId, curGateId); if (!found) return;
        found.item.note = document.getElementById('ktmTrackInput').value.trim();
        if (typeof saveToLocalStorage === 'function') saveToLocalStorage();
        if (typeof renderAll === 'function') renderAll();
        if (found.gate && typeof renderGateDetail === 'function') renderGateDetail();
        renderModal();
        if (typeof showToast === 'function') showToast('သိမ်းဆည်းပြီးပါပြီ');
    };
    window.openExternalTrack = function(p) {
        const id = extractId(document.getElementById('ktmTrackInput').value) || curTrackText;
        if (!id) { if (typeof showToast === 'function') showToast('Tracking ID အရင်ထည့်ပါ'); return; }
        window.open(p === 'kuaidi' ? `https://m.kuaidi100.com/result.jsp?nu=${encodeURIComponent(id)}` : `https://t.17track.net/en#nums=${encodeURIComponent(id)}`, '_blank', 'noopener');
    };

    // Universal click binding on any "Track" button in DOM so it ALWAYS opens the modal
    function bindAllTrackButtons() {
        document.querySelectorAll('button').forEach(btn => {
            if (btn.closest('#kismetTrackModal')) return;
            const txt = (btn.innerText || '').trim();
            if (!/\bTrack\b/i.test(txt)) return;
            let itemId = null, gateId = null;
            const card = btn.closest('div[class*="rounded-2xl"], div[class*="rounded-xl"]');
            if (card) {
                const match = (card.innerHTML || '').match(/(?:transferToShop|setShippingMethod|toggleLashioArrival|editGateItemKg)\('([^']+)'/);
                if (match) itemId = match[1];
            }
            if (typeof activeGateId !== 'undefined') gateId = activeGateId;
            btn.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); window.openKismetTrackModal(itemId, gateId); };
        });
    }

    let notiReady = false;
    async function initNoti() {
        const LN = getCap('LocalNotifications'); if (!LN || notiReady) return;
        try {
            const p = await LN.checkPermissions(); if (p.display !== 'granted') await LN.requestPermissions();
            if (typeof LN.createChannel === 'function') await LN.createChannel({ id: 'kismet_live_alerts', name: 'KISMET Alerts', importance: 4, visibility: 1, vibration: true });
            notiReady = true;
        } catch (e) {}
    }

    if (typeof window.updateNavigationUI === 'function') { const o = window.updateNavigationUI; window.updateNavigationUI = function() { const r = o.apply(this, arguments); if (window.KISMET_AFTER_NAV) window.KISMET_AFTER_NAV(); bindAllTrackButtons(); return r; }; }
    if (typeof window.switchKgRouteTab === 'function') { const o = window.switchKgRouteTab; window.switchKgRouteTab = function(t) { const r = o.apply(this, arguments); if (window.KISMET_SET_METHOD) window.KISMET_SET_METHOD(t, true); return r; }; }
    if (typeof window.setShippingMethod === 'function') { const o = window.setShippingMethod; window.setShippingMethod = function(id, m) { const r = o.apply(this, arguments); if (window.KISMET_SET_METHOD) window.KISMET_SET_METHOD(m, true); return r; }; }
    if (typeof window.renderPage4KgCalculator === 'function') { const o = window.renderPage4KgCalculator; window.renderPage4KgCalculator = function() { const r = o.apply(this, arguments); if (window.KISMET_ANIMATE_DONUT) window.KISMET_ANIMATE_DONUT(); return r; }; }
    if (typeof window.renderAll === 'function') { const o = window.renderAll; window.renderAll = function() { const r = o.apply(this, arguments); if (window.KISMET_SYNC_PANEL) window.KISMET_SYNC_PANEL(false); bindAllTrackButtons(); return r; }; }
    if (typeof window.triggerNotificationAlert === 'function') {
        const o = window.triggerNotificationAlert;
        window.triggerNotificationAlert = function(sender, msg) {
            const r = o.apply(this, arguments);
            try { const H = getCap('Haptics'); if (H && H.vibrate) H.vibrate({ duration: 450 }); } catch (e) {}
            try { if (navigator.vibrate) navigator.vibrate([400, 120, 480]); } catch (e) {}
            const LN = getCap('LocalNotifications');
            if (LN) (notiReady ? Promise.resolve() : initNoti()).then(() => LN.schedule({ notifications: [{ id: Math.floor((Date.now() % 2000000000) + Math.random() * 999), title: `KISMET • ${sender || 'Alert'}`, body: String(msg || 'အသိပေးချက်အသစ်'), channelId: 'kismet_live_alerts', schedule: { at: new Date(Date.now() + 80) } }] })).catch(() => {});
            return r;
        };
    }

    setInterval(bindAllTrackButtons, 800);
    setTimeout(() => { bindAllTrackButtons(); initNoti(); }, 250);
})();
                                                                                                                                                       </script>
