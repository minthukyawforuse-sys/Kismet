<!-- KISMET ADDON 2A: GALLERY SAVER, ROUTE PANEL & KG% ANIMATION -->
<script>
(function initKismetAddonPartA() {
    if (window.__kismetAddon2ALoaded) return;
    window.__kismetAddon2ALoaded = true;
    const getCap = (n) => (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins[n] : null;
    const haptic = () => { try { const H = getCap('Haptics'); if (H && H.impact) H.impact({ style: 'LIGHT' }); else if (navigator.vibrate) navigator.vibrate(25); } catch (e) {} };
    const blobToB64 = (b) => new Promise((res, rej) => { const f = new FileReader(); f.onloadend = () => res(f.result); f.onerror = rej; f.readAsDataURL(b); });

    // 1. NATIVE ANDROID GALLERY & EXCEL SAVER
    function interceptSave(a) {
        const saver = getCap('KismetSaver'); if (!saver || !a) return false;
        const href = a.href || a.getAttribute('href') || '';
        const dl = a.download || a.getAttribute('download') || ('KISMET_' + Date.now() + '.png');
        if (!href) return false;
        if (href.startsWith('data:image/')) {
            saver.saveImage({ base64: href, filename: dl })
                .then(() => { if (typeof showToast === 'function') showToast('✅ Gallery (Pictures/KISMET) ထဲ သိမ်းပြီးပါပြီ'); haptic(); })
                .catch(e => { if (typeof showToast === 'function') showToast('⚠️ Gallery သိမ်းမရပါ: ' + (e && e.message ? e.message : 'Error')); });
            return true;
        }
        if (href.startsWith('blob:')) {
            fetch(href).then(r => r.blob()).then(b => {
                if ((b.type && b.type.startsWith('image/')) || /\.(png|jpg|jpeg|webp)$/i.test(dl)) {
                    return blobToB64(b).then(url => saver.saveImage({ base64: url, filename: dl }))
                        .then(() => { if (typeof showToast === 'function') showToast('✅ Gallery (Pictures/KISMET) ထဲ သိမ်းပြီးပါပြီ'); haptic(); });
                }
                return b.text().then(t => saver.saveFile({ text: t, filename: dl, mime: b.type || 'text/csv' }))
                    .then(() => { if (typeof showToast === 'function') showToast('✅ Download/KISMET ထဲ သိမ်းပြီးပါပြီ'); haptic(); });
            }).catch(e => { if (typeof showToast === 'function') showToast('⚠️ သိမ်းမရပါ: ' + (e && e.message ? e.message : 'Error')); });
            return true;
        }
        return false;
    }
    const origClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function() { if (interceptSave(this)) return; return origClick.apply(this, arguments); };
    document.addEventListener('click', (e) => { const a = e.target && e.target.closest ? e.target.closest('a[download]') : null; if (a && interceptSave(a)) { e.preventDefault(); e.stopPropagation(); } }, true);

    // 2. CHINA - LASHIO - YANGON PANEL (MOUNTS RIGHT BELOW SEARCH BAR)
    let panelMethod = 'Air', lastPct = -1;
    const MINI_SVGS = {
        Air: `<svg viewBox="0 0 24 24" fill="white"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" transform="rotate(90 12 12)"/></svg>`,
        Land: `<svg viewBox="0 0 24 24" fill="white"><path d="M18 18.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-12 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM20 8h-3V4H3a1 1 0 0 0-1 1v11h2a3 3 0 0 0 6 0h4a3 3 0 0 0 6 0h2v-5l-2-3zm-3 1.5h2.2l1.3 2H17v-2z"/></svg>`,
        Post: `<svg viewBox="0 0 24 24" fill="white"><path d="M12 2C8.69 2 6 4.69 6 8v10h4v4h4v-4h4V8c0-3.31-2.69-6-6-6zm3 7H9V7h6v2zm-5 3h4v1.5h-4V12z"/></svg>`
    };

    function mountRoutePanel() {
        let p = document.getElementById('kismetRouteAnimPanel');
        if (!p) {
            p = document.createElement('div');
            p.id = 'kismetRouteAnimPanel'; p.className = 'space-y-2';
            p.innerHTML = `<div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-1.5 min-w-0">
                    <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse shrink-0"></span>
                    <span class="text-[11px] font-extrabold text-white truncate">တရုတ် - လားရှိုး - ရန်ကုန်</span>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                    <button type="button" data-m="Air" class="kra-tab kra-active">✈️ Air</button>
                    <button type="button" data-m="Land" class="kra-tab">🚚 Land</button>
                    <button type="button" data-m="Post" class="kra-tab">📮 Post</button>
                </div></div>
                <div class="flex items-center gap-3 bg-[#0a0a0c] border border-neutral-800 rounded-2xl px-3 py-2.5">
                    <div class="flex-1 min-w-0">
                        <div class="kra-track-wrap"><div class="kra-rail"></div><div id="kraTrailEl" class="kra-trail"></div>
                            <span class="kra-node kra-node-cn"></span><span class="kra-node kra-node-ls"></span><span class="kra-node kra-node-yg"></span>
                            <div id="kraVehicleEl" class="kra-vehicle"><span id="kraVehicleInner">${MINI_SVGS.Air}</span></div>
                        </div>
                        <div class="flex justify-between text-[10px] font-bold px-0.5 mt-0.5">
                            <span class="text-neutral-300">တရုတ်</span><span class="text-orange-400">လားရှိုး</span><span class="text-white">ရန်ကုန်</span>
                        </div>
                        <div class="flex items-center justify-between gap-2 mt-1.5">
                            <div id="kraStatusText" class="text-[10px] text-neutral-400 truncate">Air • အသင့်ရှိသည်</div>
                            <button type="button" id="kraOpenMapBtn" class="px-2 py-0.5 rounded-lg bg-orange-600/20 border border-orange-500/45 text-orange-400 text-[10px] font-extrabold shrink-0">📍 Track မြေပုံ</button>
                        </div>
                    </div>
                    <button type="button" id="kraMiniKgBtn" class="shrink-0 flex flex-col items-center pl-2.5 border-l border-neutral-800">
                        <div class="relative w-14 h-14 flex items-center justify-center">
                            <svg viewBox="0 0 42 42" class="w-full h-full -rotate-90">
                                <circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#262629" stroke-width="4.5"></circle>
                                <circle id="kraMiniRingCircle" class="kra-ring-progress" cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#f26419" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="100 100" stroke-dashoffset="100"></circle>
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                                <span id="kraMiniPctText" class="text-[11px] font-extrabold text-white leading-none">0%</span>
                                <span class="text-[8px] font-bold text-orange-400 mt-0.5">Kg %</span>
                            </div>
                        </div>
                        <span id="kraMiniKgText" class="text-[9px] font-bold text-neutral-400 mt-0.5">0.0 Kg</span>
                    </button>
                </div>`;
            p.querySelectorAll('.kra-tab').forEach(b => b.addEventListener('click', () => window.KISMET_SET_METHOD(b.getAttribute('data-m'), true)));
            p.querySelector('#kraMiniKgBtn').addEventListener('click', () => { if (typeof switchPage === 'function') switchPage(4); if (typeof switchKgRouteTab === 'function') switchKgRouteTab(panelMethod); });
            p.querySelector('#kraOpenMapBtn').addEventListener('click', () => { if (window.openKismetTrackModal) window.openKismetTrackModal(null, null, panelMethod); });
        }
        if (!p.isConnected) {
            const searchInp = document.querySelector('input[placeholder*="ပစ္စည်းအမည်"], input[type="search"]');
            const anchor = searchInp ? (searchInp.closest('div.relative') || searchInp.parentElement) : document.querySelector('main');
            if (anchor && anchor.parentElement) anchor.parentElement.insertBefore(p, anchor.nextSibling);
            else document.body.insertBefore(p, document.body.firstChild);
        }
        const isShop = typeof currentMainMode !== 'undefined' && currentMainMode === 'shop';
        p.style.display = isShop ? 'none' : '';
    }

    window.KISMET_SET_METHOD = function(m, replay) {
        if (!MINI_SVGS[m]) return; panelMethod = m;
        const p = document.getElementById('kismetRouteAnimPanel');
        if (p) {
            p.querySelectorAll('.kra-tab').forEach(b => b.classList.toggle('kra-active', b.getAttribute('data-m') === m));
            const inn = document.getElementById('kraVehicleInner'); if (inn) inn.innerHTML = MINI_SVGS[m];
        }
        if (replay) {
            const v = document.getElementById('kraVehicleEl'), t = document.getElementById('kraTrailEl');
            if (v && t) { v.style.animation = 'none'; t.style.animation = 'none'; void v.offsetWidth; v.style.animation = ''; t.style.animation = ''; }
        }
        window.KISMET_SYNC_PANEL(replay);
    };

    window.KISMET_SYNC_PANEL = function(replay) {
        mountRoutePanel();
        const list = (typeof allRouteRecords !== 'undefined' && typeof ROUTE_KEY !== 'undefined' && Array.isArray(allRouteRecords[ROUTE_KEY])) ? allRouteRecords[ROUTE_KEY] : [];
        const allKg = list.reduce((s, i) => s + (parseFloat(i.kg) || 0), 0);
        const sub = list.filter(i => (i.method || 'Air') === panelMethod);
        const subKg = sub.reduce((s, i) => s + (parseFloat(i.kg) || 0), 0);
        const pct = allKg > 0 ? (subKg / allKg) * 100 : (list.length > 0 ? (sub.length / list.length) * 100 : 0);
        const st = document.getElementById('kraStatusText'); if (st) st.innerText = `${panelMethod} • ${sub.length} မျိုး • ${subKg.toFixed(1)} Kg`;
        const pe = document.getElementById('kraMiniPctText'), ke = document.getElementById('kraMiniKgText'), rg = document.getElementById('kraMiniRingCircle');
        if (pe) pe.innerText = `${Math.round(pct)}%`; if (ke) ke.innerText = `${subKg.toFixed(1)} Kg`;
        if (rg && (replay || Math.abs(pct - lastPct) > 0.2)) {
            rg.style.transition = 'none'; rg.setAttribute('stroke-dashoffset', '100'); void rg.getBoundingClientRect();
            requestAnimationFrame(() => requestAnimationFrame(() => { rg.style.transition = ''; rg.setAttribute('stroke-dashoffset', String(Math.max(0, 100 - Math.min(100, pct)))); }));
            lastPct = pct;
        }
    };

    // 3. KG% DONUT CIRCLE ANIMATION (AUTO-OBSERVED)
    let donutLock = false;
    window.KISMET_ANIMATE_DONUT = function() {
        if (donutLock) return;
        const svg = document.getElementById('kgDonutSvg'); if (!svg) return;
        const slices = Array.from(svg.querySelectorAll('circle')).slice(1); if (!slices.length) return;
        donutLock = true;
        slices.forEach(c => { const fd = c.getAttribute('stroke-dasharray'); if (!fd) return; c.style.transition = 'none'; c.setAttribute('stroke-dasharray', '0 100'); c.dataset.fd = fd; });
        svg.classList.remove('kg-donut-popping'); void svg.getBoundingClientRect(); svg.classList.add('kg-donut-popping');
        requestAnimationFrame(() => requestAnimationFrame(() => {
            slices.forEach((c, i) => { if (!c.dataset.fd) return; c.style.transition = `stroke-dasharray 0.85s cubic-bezier(0.22, 1, 0.36, 1) ${i * 70}ms`; c.setAttribute('stroke-dasharray', c.dataset.fd); });
            setTimeout(() => { donutLock = false; }, 180);
        }));
    };

    function bootA() {
        mountRoutePanel(); window.KISMET_SYNC_PANEL(true);
        const s = getCap('KismetSaver'); if (s && s.requestMediaPermission) s.requestMediaPermission().catch(() => {});
        const svg = document.getElementById('kgDonutSvg');
        if (svg && !svg.dataset.obs) {
            svg.dataset.obs = '1';
            new MutationObserver(() => { if (!donutLock) window.KISMET_ANIMATE_DONUT(); }).observe(svg, { childList: true });
        }
    }
    setTimeout(bootA, 150);
    setInterval(() => { mountRoutePanel(); window.KISMET_SYNC_PANEL(false); }, 1500);
})();
                                            </script>
