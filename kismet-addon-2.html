<!-- ==================== KISMET ADDON PART 2: JAVASCRIPT LOGIC ==================== -->
<script>
(function initKismetAllAddons() {
    if (window.__kismetAddonsLoaded) return;
    window.__kismetAddonsLoaded = true;

    function getCapPlugin(name) {
        return window.Capacitor && window.Capacitor.Plugins ? window.Capacitor.Plugins[name] : null;
    }

    // A. NATIVE ANDROID GALLERY & CSV SAVER
    const origAnchorClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function() {
        const saver = getCapPlugin('KismetSaver');
        const dl = this.download || this.getAttribute('download');
        const href = this.href || this.getAttribute('href') || '';
        if (saver && dl && href) {
            if (href.startsWith('data:image/')) {
                saver.saveImage({ base64: href, filename: dl })
                    .then(() => {
                        if (typeof showToast === 'function') showToast('✅ Gallery (KISMET Album) ထဲ သိမ်းပြီးပါပြီ');
                        fireNativeHapticLight();
                    })
                    .catch(err => {
                        if (typeof showToast === 'function') showToast('⚠️ Gallery သိမ်းမရပါ: ' + (err && err.message ? err.message : 'Error'));
                    });
                return;
            }
            if (href.startsWith('blob:')) {
                fetch(href)
                    .then(r => r.text())
                    .then(text => saver.saveFile({ text: text, filename: dl, mime: 'text/csv' }))
                    .then(() => {
                        if (typeof showToast === 'function') showToast('✅ Download/KISMET ထဲ Excel ဖိုင် သိမ်းပြီးပါပြီ');
                        fireNativeHapticLight();
                    })
                    .catch(err => {
                        if (typeof showToast === 'function') showToast('⚠️ Excel သိမ်းမရပါ: ' + (err && err.message ? err.message : 'Error'));
                    });
                return;
            }
        }
        return origAnchorClick.apply(this, arguments);
    };

    // B. APPLE BLUR TRANSFER & LIQUID PILLS
    const TAB_GROUPS = [
        { selector: '#mode-btn-dash', activeClass: 'burnt-orange-btn', tone: 'brand' },
        { selector: '#nav-btn-0', activeClass: 'burnt-orange-btn', tone: 'brand' },
        { selector: '#shop-nav-btn-0', activeClass: 'burnt-orange-btn', tone: 'brand' },
        { selector: '#kg-tab-Air', activeClass: 'bg-orange-600', tone: 'orange' },
        { selector: '#deli-src-shop', activeClass: 'bg-orange-600', tone: 'orange' }
    ];

    function getOrCreatePill(container, tone) {
        let pill = container.querySelector(':scope > .liquid-pill');
        if (!pill) {
            if (getComputedStyle(container).position === 'static') container.style.position = 'relative';
            pill = document.createElement('span');
            pill.className = 'liquid-pill liquid-instant';
            pill.setAttribute('data-tone', tone);
            pill.setAttribute('aria-hidden', 'true');
            pill.innerHTML = '<span class="liquid-pill-inner"></span>';
            container.insertBefore(pill, container.firstChild);
        }
        return pill;
    }

    function updateLiquidGroup(group, forceInstant) {
        const sampleBtn = document.querySelector(group.selector);
        if (!sampleBtn || !sampleBtn.parentElement) return;
        const container = sampleBtn.parentElement;
        if (container.offsetWidth === 0 || container.offsetHeight === 0) {
            const existing = container.querySelector(':scope > .liquid-pill');
            if (existing) existing.dataset.wasHidden = '1';
            return;
        }
        const activeBtn = Array.from(container.children).find(
            el => el.tagName === 'BUTTON' && el.classList.contains(group.activeClass)
        );
        if (!activeBtn) return;

        const pill = getOrCreatePill(container, group.tone);
        const x = activeBtn.offsetLeft, y = activeBtn.offsetTop;
        const w = activeBtn.offsetWidth, h = activeBtn.offsetHeight;
        const br = getComputedStyle(activeBtn).borderRadius;
        const isFirst = !container.classList.contains('liquid-nav-ready') || pill.dataset.wasHidden === '1';
        const prevX = parseFloat(pill.dataset.prevX);
        const moved = !isNaN(prevX) && Math.abs(x - prevX) > 2;

        pill.classList.toggle('liquid-instant', Boolean(forceInstant || isFirst));
        pill.style.width = w + 'px'; pill.style.height = h + 'px'; pill.style.borderRadius = br;
        pill.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        pill.dataset.prevX = String(x); pill.dataset.wasHidden = '0';
        container.classList.add('liquid-nav-ready');

        if (moved && !forceInstant && !isFirst) {
            pill.classList.remove('liquid-stretching'); void pill.offsetWidth; pill.classList.add('liquid-stretching');
            clearTimeout(pill._stretchTimer);
            pill._stretchTimer = setTimeout(() => pill.classList.remove('liquid-stretching'), 480);
        }
        if (forceInstant || isFirst) requestAnimationFrame(() => pill.classList.remove('liquid-instant'));
    }

    function syncAllLiquidPills(forceInstant) { TAB_GROUPS.forEach(g => updateLiquidGroup(g, forceInstant)); }

    let lastPageId = null;
    function triggerAppleBlur(el, cls = 'apple-blur-transfer') {
        if (!el) return;
        el.classList.remove('page-transition', 'apple-blur-transfer', 'apple-blur-soft');
        void el.offsetWidth; el.classList.add(cls);
        clearTimeout(el._blurTimer);
        const cleanup = () => el.classList.remove(cls);
        el.addEventListener('animationend', cleanup, { once: true });
        el._blurTimer = setTimeout(cleanup, 520);
    }

    function getActivePageEl() {
        if (typeof currentMainMode === 'undefined') return null;
        if (currentMainMode === 'dashboard') return document.getElementById('page-dashboard');
        if (currentMainMode === 'route') return document.getElementById('page-' + currentPage);
        if (currentMainMode === 'shop') return document.getElementById('shop-page-' + currentShopPage);
        return null;
    }

    // C. ROUTE ANIMATION PANEL & KG% CIRCLE SWEEP
    let activePanelMethod = 'Air', lastMiniPct = -1;
    const VEHICLE_SVGS = {
        Air: `<svg viewBox="0 0 24 24" fill="white"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" transform="rotate(90 12 12)"/></svg>`,
        Land: `<svg viewBox="0 0 24 24" fill="white"><path d="M18 18.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-12 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM20 8h-3V4H3a1 1 0 0 0-1 1v11h2a3 3 0 0 0 6 0h4a3 3 0 0 0 6 0h2v-5l-2-3zm-3 1.5h2.2l1.3 2H17v-2z"/></svg>`,
        Post: `<svg viewBox="0 0 24 24" fill="white"><path d="M12 2C8.69 2 6 4.69 6 8v10h4v4h4v-4h4V8c0-3.31-2.69-6-6-6zm3 7H9V7h6v2zm-5 3h4v1.5h-4V12z"/></svg>`
    };
    const METHOD_LABELS = { Air: 'လေယာဉ် (Air)', Land: 'ကား (Land)', Post: 'စာတိုက်ပုံး (Post)' };

    function createRouteAnimPanel() {
        if (document.getElementById('kismetRouteAnimPanel')) return;
        const panel = document.createElement('div');
        panel.id = 'kismetRouteAnimPanel';
        panel.className = 'kra-mode-Air space-y-2';
        panel.innerHTML = `
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-1.5 min-w-0">
                    <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse shrink-0"></span>
                    <span class="text-[11px] font-extrabold text-white truncate">တရုတ် - လားရှိုး - ရန်ကုန်</span>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                    <button type="button" data-kra="Air" class="kra-tab kra-active">✈️ Air</button>
                    <button type="button" data-kra="Land" class="kra-tab">🚚 Land</button>
                    <button type="button" data-kra="Post" class="kra-tab">📮 Post</button>
                </div>
            </div>
            <div class="flex items-center gap-3 bg-[#0a0a0c] border border-[#222225] rounded-2xl px-3 py-2.5">
                <div class="flex-1 min-w-0">
                    <div class="kra-track-wrap">
                        <div class="kra-rail"></div><div id="kraTrailEl" class="kra-trail"></div>
                        <span class="kra-node kra-node-cn"></span><span class="kra-node kra-node-ls"></span><span class="kra-node kra-node-yg"></span>
                        <div id="kraVehicleEl" class="kra-vehicle"><span id="kraVehicleInner" class="kra-vehicle-inner">${VEHICLE_SVGS.Air}</span></div>
                    </div>
                    <div class="flex items-center justify-between text-[10px] font-bold px-0.5 mt-0.5">
                        <span class="text-neutral-300">တရုတ်</span><span class="text-orange-400">လားရှိုး</span><span class="text-white">ရန်ကုန်</span>
                    </div>
                    <div id="kraStatusText" class="text-[10px] text-neutral-400 mt-1.5 truncate"></div>
                </div>
                <button type="button" id="kraMiniKgBtn" class="shrink-0 flex flex-col items-center justify-center pl-2.5 border-l border-neutral-800 btn-bounce">
                    <div class="relative w-14 h-14 flex items-center justify-center">
                        <svg viewBox="0 0 42 42" class="w-full h-full -rotate-90">
                            <circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#262629" stroke-width="4.5"></circle>
                            <circle id="kraMiniRingCircle" class="kra-ring-progress" cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#f26419" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="100 100" stroke-dashoffset="100"></circle>
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span id="kraMiniPctText" class="text-[11px] font-extrabold text-white leading-none">0%</span>
                            <span class="text-[8px] font-bold text-orange-400 mt-0.5">Kg %</span>
                        </div>
                    </div>
                    <span id="kraMiniKgText" class="text-[9px] font-bold text-neutral-400 mt-0.5">0.0 Kg</span>
                </button>
            </div>`;
        panel.querySelectorAll('.kra-tab').forEach(btn => btn.addEventListener('click', () => setRouteAnimMethod(btn.getAttribute('data-kra'), true)));
        panel.querySelector('#kraMiniKgBtn').addEventListener('click', () => {
            if (typeof switchPage === 'function') switchPage(4);
            if (typeof switchKgRouteTab === 'function') switchKgRouteTab(activePanelMethod);
        });
        mountPanelInCurrentView(panel);
        updateRouteAnimPanelData(true);
    }

    function mountPanelInCurrentView(panelEl) {
        if (!panelEl && !document.getElementById('kismetRouteAnimPanel')) createRouteAnimPanel();
        const panel = panelEl || document.getElementById('kismetRouteAnimPanel');
        if (!panel) return;
        const mode = (typeof currentMainMode !== 'undefined') ? currentMainMode : 'dashboard';
        if (mode === 'shop') { panel.classList.add('hidden'); return; }
        panel.classList.remove('hidden');
        if (mode === 'dashboard') {
            const dash = document.getElementById('page-dashboard');
            if (dash && dash.firstElementChild && panel.parentElement !== dash) dash.insertBefore(panel, dash.firstElementChild.nextSibling);
        } else if (mode === 'route') {
            const secRoute = document.getElementById('section-route');
            if (secRoute && panel.parentElement !== secRoute) secRoute.insertBefore(panel, secRoute.firstChild);
        }
    }

    function setRouteAnimMethod(method, forceReplay) {
        if (!VEHICLE_SVGS[method]) return;
        const changed = activePanelMethod !== method;
        activePanelMethod = method;
        const panel = document.getElementById('kismetRouteAnimPanel');
        if (panel) {
            panel.classList.remove('kra-mode-Air', 'kra-mode-Land', 'kra-mode-Post');
            panel.classList.add('kra-mode-' + method);
            panel.querySelectorAll('.kra-tab').forEach(b => b.classList.toggle('kra-active', b.getAttribute('data-kra') === method));
            const inner = document.getElementById('kraVehicleInner');
            if (inner) inner.innerHTML = VEHICLE_SVGS[method];
        }
        if (changed || forceReplay) {
            const v = document.getElementById('kraVehicleEl'), t = document.getElementById('kraTrailEl');
            if (v && t) { v.style.animation = 'none'; t.style.animation = 'none'; void v.offsetWidth; v.style.animation = ''; t.style.animation = ''; }
        }
        updateRouteAnimPanelData(changed || forceReplay);
    }

    function updateRouteAnimPanelData(replayRing) {
        if (!document.getElementById('kismetRouteAnimPanel')) return;
        const list = (typeof allRouteRecords !== 'undefined' && typeof ROUTE_KEY !== 'undefined' && Array.isArray(allRouteRecords[ROUTE_KEY])) ? allRouteRecords[ROUTE_KEY] : [];
        const totalKgAll = list.reduce((s, i) => s + (parseFloat(i.kg) || 0), 0);
        const sub = list.filter(i => (i.method || 'Air') === activePanelMethod);
        const subKg = sub.reduce((s, i) => s + (parseFloat(i.kg) || 0), 0);
        const subArrived = sub.filter(i => i.arrived).length;
        const pct = totalKgAll > 0 ? (subKg / totalKgAll) * 100 : (list.length > 0 ? (sub.length / list.length) * 100 : 0);

        const st = document.getElementById('kraStatusText');
        if (st) st.innerText = sub.length > 0 ? `${METHOD_LABELS[activePanelMethod]} • ${sub.length} မျိုး (လားရှိုးရောက် ${subArrived})` : `${METHOD_LABELS[activePanelMethod]} လမ်းကြောင်း • အသင့်ရှိသည်`;
        const pEl = document.getElementById('kraMiniPctText'), kEl = document.getElementById('kraMiniKgText'), ring = document.getElementById('kraMiniRingCircle');
        if (pEl) pEl.innerText = `${Math.round(pct)}%`;
        if (kEl) kEl.innerText = `${subKg.toFixed(1)} Kg`;
        if (ring && (replayRing || Math.abs(pct - lastMiniPct) > 0.2)) {
            const targetOffset = Math.max(0, 100 - Math.min(100, pct));
            ring.style.transition = 'none'; ring.setAttribute('stroke-dashoffset', '100'); void ring.getBoundingClientRect();
            requestAnimationFrame(() => { ring.style.transition = ''; ring.setAttribute('stroke-dashoffset', targetOffset.toFixed(2)); });
            lastMiniPct = pct;
        }
    }

    function animatePage4DonutCircle() {
        const svg = document.getElementById('kgDonutSvg');
        if (!svg || svg.querySelectorAll('circle').length <= 1) return;
        const ns = 'http://www.w3.org/2000/svg';
        const oldD = svg.querySelector('defs[data-kg-anim]'); if (oldD) oldD.remove();
        const oldG = svg.querySelector('g[data-kg-anim]');
        if (oldG) { while (oldG.firstChild) svg.appendChild(oldG.firstChild); oldG.remove(); }

        const maskId = 'kgDonutSweepMask_' + Date.now();
        const defs = document.createElementNS(ns, 'defs'); defs.setAttribute('data-kg-anim', '1');
        const mask = document.createElementNS(ns, 'mask'); mask.setAttribute('id', maskId);
        const sweep = document.createElementNS(ns, 'circle');
        sweep.setAttribute('cx', '21'); sweep.setAttribute('cy', '21'); sweep.setAttribute('r', '15.91549430918954');
        sweep.setAttribute('fill', 'none'); sweep.setAttribute('stroke', '#ffffff'); sweep.setAttribute('stroke-width', '8');
        sweep.setAttribute('stroke-dasharray', '100 100'); sweep.setAttribute('stroke-dashoffset', '100');
        sweep.setAttribute('class', 'kg-donut-sweep-mask');
        mask.appendChild(sweep); defs.appendChild(mask);

        const g = document.createElementNS(ns, 'g'); g.setAttribute('data-kg-anim', '1'); g.setAttribute('mask', `url(#${maskId})`);
        Array.from(svg.querySelectorAll('circle')).slice(1).forEach(c => g.appendChild(c));
        svg.insertBefore(defs, svg.firstChild); svg.appendChild(g);
        svg.classList.remove('kg-donut-popping'); void svg.getBoundingClientRect(); svg.classList.add('kg-donut-popping');

        document.querySelectorAll('#kgCalculatorItemList div[style*="width:"]').forEach(bar => {
            const finalW = bar.style.width; bar.style.transition = 'none'; bar.style.width = '0%';
            requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = 'width 0.75s cubic-bezier(0.22, 1, 0.36, 1)'; bar.style.width = finalW; }));
        });
    }

    // D. DARK MAP TRACKING MODAL
    let activeTrackItemId = null, activeTrackGateId = null, currentExtractedTrackId = '';
    function extractTrackId(text) {
        if (!text) return '';
        const m = String(text).trim().match(/\b([A-Za-z]{1,4}\d{8,20}|\d{10,20})\b/);
        return m ? m[1].toUpperCase() : '';
    }
    function detectCourierName(trackId) {
        if (!trackId) return 'Tracking ID မထည့်ရသေးပါ';
        const id = trackId.toUpperCase();
        if (/^JT\d{10,}$/.test(id)) return 'J&T Express (极兔速递)';
        if (/^SF\d{10,}$/.test(id)) return 'SF Express (顺丰速运)';
        if (/^YT\d{10,}$/.test(id)) return 'YTO Express (圆通速递)';
        if (/^(75|78|73|54)\d{10,12}$/.test(id)) return 'ZTO Express (中通快递)';
        if (/^77\d{11,13}$/.test(id)) return 'STO Express (申通快递)';
        if (/^(43|46|31)\d{11,13}$/.test(id)) return 'Yunda Express (韵达快递)';
        if (/^(JD|JDV|JDX)[A-Z0-9]{9,}$/.test(id)) return 'JD Logistics (京东物流)';
        if (/^(E[A-Z]\d{9}CN|98\d{11}|1\d{12})$/.test(id)) return 'China Post / EMS';
        if (/^DPK\d{10,}$/.test(id)) return 'Deppon Express (德邦)';
        return 'China Express / Courier';
    }
    function findItemAnywhere(itemId, gateId) {
        if (gateId && typeof gateShipments !== 'undefined') {
            const g = gateShipments.find(s => s.id === gateId);
            if (g) { const it = (g.items || []).find(x => x.id === itemId); if (it) return { item: it, gate: g }; }
        }
        const list = (typeof allRouteRecords !== 'undefined' && typeof ROUTE_KEY !== 'undefined') ? (allRouteRecords[ROUTE_KEY] || []) : [];
        const direct = list.find(x => x && x.id === itemId);
        if (direct) return { item: direct, gate: null };
        if (typeof gateShipments !== 'undefined') {
            for (const g of gateShipments) { const it = (g.items || []).find(x => x && x.id === itemId); if (it) return { item: it, gate: g }; }
        }
        return null;
    }

    function renderTrackModalContent() {
        const found = findItemAnywhere(activeTrackItemId, activeTrackGateId);
        if (!found) return;
        const { item, gate } = found, method = item.method || 'Air';
        const emoji = method === 'Air' ? '✈️' : (method === 'Post' ? '📮' : '🚚');
        let pct = 25, heroTitle = 'တရုတ်မှ ထွက်ခွာနေဆဲ', heroSub = 'တရုတ် ➔ လားရှိုး လမ်းပေါ်တွင် ရှိနေပါသည်', stageSummary = 'လားရှိုးသို့ ရောက်ရှိရန် စောင့်ဆိုင်းနေသည်';
        if (gate && gate.checked) { pct = 100; heroTitle = 'ရန်ကုန် ရောက်ရှိ စစ်ဆေးပြီး ✅'; heroSub = `${gate.gate} မှတဆင့် ရန်ကုန်ရောက် စစ်ပြီးပါပြီ`; stageSummary = `ပြီးစီးပြီ (${gate.checkedAt || gate.date})`; }
        else if (gate) { pct = 82; heroTitle = 'ရန်ကုန်သို့ ပို့ဆောင်နေဆဲ'; heroSub = `${gate.gate} ကားဂိတ်သို့ တင်ပို့ပြီးပါပြီ`; stageSummary = `ကားဂိတ်တင်ပြီး (${gate.date})`; }
        else if (item.arrived) { pct = 55; heroTitle = 'လားရှိုးဂိတ် ရောက်ရှိပြီး ✅'; heroSub = `${method} လမ်းကြောင်းဖြင့် ရန်ကုန်ပို့ရန် အသင့်ရှိသည်`; stageSummary = `လားရှိုးရောက်ပြီး • ${method} လမ်းကြောင်း`; }

        document.getElementById('ktmHeroTitle').innerText = heroTitle;
        document.getElementById('ktmHeroSub').innerText = heroSub;
        document.getElementById('ktmPctLabel').innerText = `${pct}%`;
        document.getEl
