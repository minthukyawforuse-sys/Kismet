<!-- ==================== KISMET ADDON PART 1: STYLES & MAP MODAL ==================== -->
<style>
    /* 1. Apple Blur Page Transfer */
    @keyframes appleBlurTransfer {
        0% { opacity: 0; filter: blur(14px); transform: translate3d(0, 14px, 0) scale(0.965); }
        65% { opacity: 1; filter: blur(1.5px); }
        100% { opacity: 1; filter: blur(0px); transform: translate3d(0, 0, 0) scale(1); }
    }
    .apple-blur-transfer {
        animation: appleBlurTransfer 0.44s cubic-bezier(0.22, 1, 0.36, 1) both !important;
        will-change: transform, opacity, filter;
    }
    @keyframes appleBlurSoft {
        0% { opacity: 0.25; filter: blur(8px); transform: scale(0.98); }
        100% { opacity: 1; filter: blur(0px); transform: scale(1); }
    }
    .apple-blur-soft {
        animation: appleBlurSoft 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
        will-change: transform, opacity, filter;
    }

    /* 2. Liquid Sliding Pill Indicator */
    .liquid-nav-ready > button {
        position: relative; z-index: 1;
        transition: color 0.28s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .liquid-nav-ready > button.burnt-orange-btn,
    .liquid-nav-ready > button.bg-orange-600 {
        background: transparent !important; border-color: transparent !important; box-shadow: none !important;
    }
    .liquid-pill {
        position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;
        will-change: transform, width, height;
        transition: transform 0.48s cubic-bezier(0.32, 1.28, 0.38, 1), width 0.44s cubic-bezier(0.32, 1.28, 0.38, 1), height 0.44s cubic-bezier(0.32, 1.28, 0.38, 1), border-radius 0.35s ease;
    }
    .liquid-pill.liquid-instant { transition: none !important; }
    .liquid-pill-inner {
        display: block; width: 100%; height: 100%; border-radius: inherit;
        position: relative; overflow: hidden; transform-origin: center center; will-change: transform;
    }
    .liquid-pill[data-tone="brand"] .liquid-pill-inner {
        background: linear-gradient(135deg, #f26419 0%, #c4420a 65%, #872904 100%);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.38), inset 0 -1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(232, 88, 18, 0.35);
    }
    .liquid-pill[data-tone="orange"] .liquid-pill-inner {
        background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.34), 0 3px 10px rgba(234, 88, 12, 0.32);
    }
    .liquid-pill-inner::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.04) 48%, rgba(255, 255, 255, 0) 100%);
    }
    @keyframes liquidDropletStretch {
        0% { transform: scaleX(1) scaleY(1); filter: blur(0px); }
        32% { transform: scaleX(1.13) scaleY(0.86); filter: blur(0.6px); }
        68% { transform: scaleX(0.96) scaleY(1.04); filter: blur(0px); }
        100% { transform: scaleX(1) scaleY(1); filter: blur(0px); }
    }
    .liquid-pill.liquid-stretching .liquid-pill-inner { animation: liquidDropletStretch 0.46s cubic-bezier(0.25, 1, 0.5, 1); }
    @keyframes appleBackdropIn { from { opacity: 0; } to { opacity: 1; } }
    div[id$="Modal"]:not(.hidden) { animation: appleBackdropIn 0.24s ease-out; }

    /* 3. Route Animation Compact Panel (CN - LS - YG) & Kg% Circle */
    #kismetRouteAnimPanel {
        background-color: #141416; border: 1px solid #262629;
        border-radius: 1.5rem; padding: 0.85rem 0.9rem; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .kra-tab {
        padding: 0.25rem 0.55rem; border-radius: 0.65rem; font-size: 10px; font-weight: 800;
        color: #a3a3a3; background: #0a0a0c; border: 1px solid #262629;
        transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .kra-tab.kra-active {
        background: linear-gradient(135deg, #f26419 0%, #c4420a 65%, #872904 100%);
        color: #ffffff; border-color: rgba(255, 255, 255, 0.18); box-shadow: 0 3px 10px rgba(232, 88, 18, 0.35);
    }
    .kra-tab:active { transform: scale(0.92); }
    .kra-track-wrap { position: relative; height: 44px; margin: 8px 14px 2px 14px; }
    .kra-rail {
        position: absolute; top: 50%; left: 0; right: 0; height: 3px; transform: translateY(-50%);
        background: repeating-linear-gradient(90deg, #323238 0 6px, transparent 6px 11px); border-radius: 999px;
    }
    .kra-trail {
        position: absolute; top: 50%; left: 0; height: 3px; width: 0%; transform: translateY(-50%);
        background: linear-gradient(90deg, #7a2806 0%, #e85812 55%, #ff8b42 100%);
        box-shadow: 0 0 10px rgba(255, 122, 41, 0.7); border-radius: 999px;
        animation: kraTrailMove 6.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .kra-node {
        position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 999px;
        background: #141416; border: 2.5px solid #52525b; transform: translate(-50%, -50%); z-index: 2;
    }
    .kra-node-cn { left: 0%; animation: kraPulseCN 6.4s ease-in-out infinite; }
    .kra-node-ls { left: 50%; animation: kraPulseLS 6.4s ease-in-out infinite; }
    .kra-node-yg { left: 100%; animation: kraPulseYG 6.4s ease-in-out infinite; }
    .kra-vehicle {
        position: absolute; top: 50%; left: 0%; width: 28px; height: 28px; border-radius: 999px;
        background: radial-gradient(circle at 30% 25%, #ff853b 0%, #e85812 60%, #872904 100%);
        border: 1.5px solid rgba(255, 255, 255, 0.55); box-shadow: 0 0 14px rgba(242, 100, 25, 0.75);
        display: flex; align-items: center; justify-content: center; z-index: 4;
        transform: translate(-50%, -50%); will-change: left, transform, opacity;
        animation: kraVehicleMove 6.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .kra-vehicle svg { width: 15px; height: 15px; display: block; }
    .kra-mode-Air .kra-vehicle-inner { animation: kraAirFloat 6.4s ease-in-out infinite; }
    .kra-mode-Land .kra-vehicle-inner { animation: kraTruckRumble 0.42s ease-in-out infinite; }
    .kra-mode-Post .kra-vehicle-inner { animation: kraPostHop 0.85s ease-in-out infinite; }

    @keyframes kraVehicleMove {
        0% { left: 0%; opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
        7% { left: 0%; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        42% { left: 50%; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        52% { left: 50%; opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        86% { left: 100%; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        94% { left: 100%; opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        100% { left: 100%; opacity: 0; transform: translate(-50%, -50%) scale(0.72); }
    }
    @keyframes kraTrailMove {
        0% { width: 0%; opacity: 0; }
        7% { width: 0%; opacity: 1; }
        42% { width: 50%; opacity: 1; }
        52% { width: 50%; opacity: 1; }
        86% { width: 100%; opacity: 1; }
        94% { width: 100%; opacity: 1; }
        100% { width: 100%; opacity: 0; }
    }
    @keyframes kraAirFloat { 0%, 7%, 42%, 52%, 86%, 100% { transform: translateY(0) rotate(0deg); } 24%, 69% { transform: translateY(-6px) rotate(-6deg); } }
    @keyframes kraTruckRumble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes kraPostHop { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-3.5px) rotate(4deg); } }
    @keyframes kraPulseCN { 0%, 18%, 100% { border-color: #52525b; box-shadow: none; } 6%, 12% { border-color: #ff7a29; background: #ff7a29; box-shadow: 0 0 10px rgba(255, 122, 41, 0.9); } }
    @keyframes kraPulseLS { 0%, 38%, 60%, 100% { border-color: #52525b; background: #141416; box-shadow: none; } 44%, 53% { border-color: #ff7a29; background: #ff7a29; box-shadow: 0 0 12px rgba(255, 122, 41, 0.95); } }
    @keyframes kraPulseYG { 0%, 82%, 100% { border-color: #52525b; background: #141416; box-shadow: none; } 87%, 95% { border-color: #ffffff; background: #ff7a29; box-shadow: 0 0 12px rgba(255, 122, 41, 0.95); } }

    .kra-ring-progress { transition: stroke-dashoffset 0.85s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes kgDonutCircleForm { 0% { stroke-dashoffset: 100; } 100% { stroke-dashoffset: 0; } }
    .kg-donut-sweep-mask { animation: kgDonutCircleForm 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes kgDonutPop { 0% { opacity: 0.4; transform: rotate(-115deg) scale(0.9); } 100% { opacity: 1; transform: rotate(-90deg) scale(1); } }
    #kgDonutSvg.kg-donut-popping { animation: kgDonutPop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    /* 4. Dark Map Tracking Modal */
    #kismetTrackModal {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); backdrop-filter: blur(8px);
        z-index: 65; display: flex; align-items: flex-end; justify-content: center; padding: 10px;
    }
    #kismetTrackModal.hidden { display: none; }
    .ktm-sheet {
        width: 100%; max-width: 28rem; max-height: 92vh; overflow-y: auto;
        background: #141416; border: 1px solid #2a2a2e; border-radius: 1.75rem;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
        animation: ktmSheetUp 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes ktmSheetUp {
        0% { opacity: 0; transform: translateY(28px) scale(0.96); filter: blur(8px); }
        100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
    }
    .ktm-map-box {
        position: relative; height: 215px; overflow: hidden; border-bottom: 1px solid #26262a;
        background: radial-gradient(circle at 75% 20%, #1d2633 0%, #11151c 58%, #0a0c10 100%);
    }
    .ktm-progress-track { position: relative; height: 7px; background: #26262a; border-radius: 999px; overflow: visible; }
    .ktm-progress-fill {
        height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #16a34a 0%, #22c55e 65%, #4ade80 100%);
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.55); transition: width 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ktm-progress-truck { position: absolute; top: 50%; transform: translate(-50%, -50%); transition: left 0.85s cubic-bezier(0.22, 1, 0.36, 1); z-index: 3; }
    .ktm-map-active-path { transition: stroke-dashoffset 0.95s cubic-bezier(0.22, 1, 0.36, 1); }
</style>
