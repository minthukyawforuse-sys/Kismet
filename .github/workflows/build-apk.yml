name: Build KISMET Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Files
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "KISMET_gate_v8.html" ]; then
            cp KISMET_gate_v8.html www/index.html
          else
            HTML_FILE=$(ls *.html | head -n 1)
            cp "$HTML_FILE" www/index.html
          fi
          cp *.png *.jpg *.jpeg www/ 2>/dev/null || true

      - name: Setup Capacitor Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "KISMET" "com.kismet.app" --web-dir www
          npx cap add android
          npx cap sync android
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />|' android/app/src/main/AndroidManifest.xml

      - name: Set App Icon
        run: |
          ICON_FILE=""
          if [ -f "1000532061.jpg" ]; then
            ICON_FILE="1000532061.jpg"
          else
            ICON_FILE=$(ls *.jpg *.jpeg 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "$ICON_FILE" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              dir="${spec%%:*}"
              size="${spec##*:}"
              convert "$ICON_FILE" -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "android/app/src/main/res/mipmap-${dir}/ic_launcher.png"
              cp "android/app/src/main/res/mipmap-${dir}/ic_launcher.png" "android/app/src/main/res/mipmap-${dir}/ic_launcher_round.png"
            done
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk KISMET.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KISMET-APK
          path: KISMET.apk
          
