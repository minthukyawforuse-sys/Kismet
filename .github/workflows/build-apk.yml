name: Build KISMET Android APK
on:
push:
branches: [ main ]
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4
- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: '20'
- name: Setup Java 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
- name: Prepare Web Files, Icons & Inject Addons
run: |
mkdir -p www/fa www/vendor
if [ -f "KISMET_gate_v8.html" ]; then
cp KISMET_gate_v8.html www/index.html
elif [ -f "index.html" ]; then
cp index.html www/index.html
else
HTML_FILE=$(ls *.html | grep -v "kismet-addon" | head -n 1)
cp "$HTML_FILE" www/index.html
fi
cp *.png *.jpg *.jpeg www/ 2>/dev/null || true
npm init -y
npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/haptics@6 @fortawesome/fontawesome-free@6 html2canvas@1.4.1
cp -r node_modules/@fortawesome/fontawesome-free/css node_modules/@fortawesome/fontawesome-free/webfonts www/fa/
cp node_modules/html2canvas/dist/html2canvas.min.js www/vendor/html2canvas.min.js
node -e '
const fs = require("fs");
const cleanAddon = (text) => text.replace(/^\s*```[a-zA-Z]\s$/gm, "");
let html = fs.readFileSync("www/index.html", "utf8");
html = html.replace(/https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css/g, "./fa/css/all.min.css");
html = html.replace(/https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js/g, "./vendor/html2canvas.min.js");
if (!fs.existsSync("1000533185.png")) {
html = html.replace("<img src="1000533185.png" alt="KISMET" class="h-6 object-contain inline-block">", "<span class="text-base font-extrabold tracking-widest text-white">KISMET</span>");
}
if (fs.existsSync("kismet-addon-1.html") || fs.existsSync("kismet-addon-2.html")) {
for (const f of ["kismet-addon-1.html", "kismet-addon-2.html"]) {
if (fs.existsSync(f)) {
html = html.replace(/</body>/i, "\n" + cleanAddon(fs.readFileSync(f, "utf8")) + "\n</body>");
}
}
} else if (fs.existsSync("kismet-addons.html")) {
html = html.replace(/</body>/i, "\n" + cleanAddon(fs.readFileSync("kismet-addons.html", "utf8")) + "\n</body>");
}
fs.writeFileSync("www/index.html", html, "utf8");
'
- name: Setup Capacitor Android Project & Native Gallery Plugin
run: |
npx cap init "KISMET" "com.kismet.app" --web-dir www
npx cap add android
npx cap sync android
cat << 'EOF' > android/app/src/main/java/com/kismet/app/KismetSaverPlugin.java
package com.kismet.app;
import android.content.ContentResolver;
import android.content.ContentValues;
import android.media.MediaScannerConnection;
import android.net.Uri;
import android.os.Build;
import android.os.Environment;
import android.provider.MediaStore;
import android.util.Base64;
import com.getcapacitor.JSObject;
import com.getcapacitor.Plugin;
import com.getcapacitor.PluginCall;
import com.getcapacitor.PluginMethod;
import com.getcapacitor.annotation.CapacitorPlugin;
import java.io.File;
import java.io.FileOutputStream;
import java.io.OutputStream;
import java.nio.charset.StandardCharsets;
@CapacitorPlugin(name = "KismetSaver")
public class KismetSaverPlugin extends Plugin {
@PluginMethod
public void saveImage(PluginCall call) {
String base64 = call.getString("base64");
String filename = call.getString("filename", "KISMET_" + System.currentTimeMillis() + ".png");
if (base64 == null || base64.isEmpty()) { call.reject("Empty image"); return; }
try {
if (base64.contains(",")) base64 = base64.substring(base64.indexOf(",") + 1);
byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
ContentValues values = new ContentValues();
values.put(MediaStore.Images.Media.DISPLAY_NAME, filename);
values.put(MediaStore.Images.Media.MIME_TYPE, "image/png");
values.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/KISMET");
values.put(MediaStore.Images.Media.IS_PENDING, 1);
ContentResolver resolver = getContext().getContentResolver();
Uri uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
if (uri == null) { call.reject("Cannot create gallery entry"); return; }
try (OutputStream out = resolver.openOutputStream(uri)) {
if (out == null) throw new Exception("OutputStream is null");
out.write(bytes);
}
values.clear();
values.put(MediaStore.Images.Media.IS_PENDING, 0);
resolver.update(uri, values, null, null);
} else {
File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES), "KISMET");
if (!dir.exists()) dir.mkdirs();
File file = new File(dir, filename);
try (FileOutputStream fos = new FileOutputStream(file)) { fos.write(bytes); }
MediaScannerConnection.scanFile(getContext(), new String[]{file.getAbsolutePath()}, new String[]{"image/png"}, null);
}
JSObject ret = new JSObject(); ret.put("saved", true); call.resolve(ret);
} catch (Exception e) { call.reject(e.getMessage()); }
}
@PluginMethod
public void saveFile(PluginCall call) {
String text = call.getString("text");
String filename = call.getString("filename", "KISMET_" + System.currentTimeMillis() + ".csv");
String mime = call.getString("mime", "text/csv");
if (text == null) { call.reject("Empty file"); return; }
try {
byte[] bytes = text.getBytes(StandardCharsets.UTF_8);
if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
ContentValues values = new ContentValues();
values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
values.put(MediaStore.Downloads.MIME_TYPE, mime);
values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/KISMET");
values.put(MediaStore.Downloads.IS_PENDING, 1);
ContentResolver resolver = getContext().getContentResolver();
Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
if (uri == null) { call.reject("Cannot create download entry"); return; }
try (OutputStream out = resolver.openOutputStream(uri)) {
if (out == null) throw new Exception("OutputStream is null");
out.write(bytes);
}
values.clear();
values.put(MediaStore.Downloads.IS_PENDING, 0);
resolver.update(uri, values, null, null);
} else {
File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "KISMET");
if (!dir.exists()) dir.mkdirs();
File file = new File(dir, filename);
try (FileOutputStream fos = new FileOutputStream(file)) { fos.write(bytes); }
}
JSObject ret = new JSObject(); ret.put("saved", true); call.resolve(ret);
} catch (Exception e) { call.reject(e.getMessage()); }
}
}
EOF
cat << 'EOF' > android/app/src/main/java/com/kismet/app/MainActivity.java
package com.kismet.app;
import android.os.Bundle;
import com.getcapacitor.BridgeActivity;
public class MainActivity extends BridgeActivity {
@Override
public void onCreate(Bundle savedInstanceState) {
registerPlugin(KismetSaverPlugin.class);
super.onCreate(savedInstanceState);
}
}
EOF
node -e '
const fs = require("fs");
const p = "android/app/src/main/AndroidManifest.xml";
let xml = fs.readFileSync(p, "utf8");
const perms = [
"    <uses-permission android:name="android.permission.VIBRATE" />",
"    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />",
"    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />"
].join("\n");
xml = xml.replace("<uses-permission android:name="android.permission.INTERNET" />", "<uses-permission android:name="android.permission.INTERNET" />\n" + perms);
fs.writeFileSync(p, xml, "utf8");
'
- name: Set App Icon
run: |
ICON_FILE=""
if [ -f "1000532061.jpg" ]; then
ICON_FILE="1000532061.jpg"
else
ICON_FILE=(ls *.jpg *.jpeg 2>/dev/null | head -n 1 || true)
fi
if [ -n "$ICON_FILE" ]; then
sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
rm -rf android/app/src/main/res/mipmap-anydpi-v26
for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
dir="${spec%%:*}"
size="{spec##*:}"
convert "ICON_FILE" -resize "{size}x${size}^" -gravity center -extent "{size}x{size}" "android/app/src/main/res/mipmap-{dir}/ic_launcher.png"
cp "android/app/src/main/res/mipmap-{dir}/ic_launcher.png" "android/app/src/main/res/mipmap-${dir}/ic_launcher_round.png"
done
fi
- name: Build APK
run: |
cd android
chmod +x gradlew
./gradlew assembleDebug
cd ..
cp android/app/build/outputs/apk/debug/app-debug.apk KISMET.apk
- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: KISMET-APK
path: KISMET.apk
