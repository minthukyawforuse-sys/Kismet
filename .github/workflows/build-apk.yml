{
"name": "Build KISMET Android APK",
"on": {
"push": { "branches": ["main"] },
"workflow_dispatch": {}
},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{ "name": "Checkout", "uses": "actions/checkout@v4" },
{ "name": "Node", "uses": "actions/setup-node@v4", "with": { "node-version": "20" } },
{ "name": "Java", "uses": "actions/setup-java@v4", "with": { "distribution": "temurin", "java-version": "17" } },
{ "name": "Build APK", "run": "node build.js" },
{ "name": "Upload APK", "uses": "actions/upload-artifact@v4", "with": { "name": "KISMET-APK", "path": "KISMET.apk" } }
]
}
}
}
